// FragLab - live competitive match (MR12)
// Resets everything changed by the warmup and knife configs.
mp_warmup_pausetimer 0
mp_maxrounds 24
// Exactly 24 rounds: no overtime, a 12-12 ends as a draw
mp_overtime_enable 0
mp_halftime 1
// Play all 24 rounds even when a team already has 13
mp_match_can_clinch 0
mp_startmoney 800
mp_maxmoney 16000
mp_freezetime 15
mp_roundtime 1.92
mp_roundtime_defuse 1.92
mp_roundtime_hostage 1.92
mp_c4timer 40
mp_buytime 20
mp_buy_anywhere 0
mp_free_armor 0
mp_give_player_c4 1
mp_ct_default_secondary weapon_hkp2000
mp_t_default_secondary weapon_glock
mp_ct_default_melee weapon_knife
mp_t_default_melee weapon_knife
mp_death_drop_gun 1
// Practice turns knife drops on; scrim must turn them off again, also when switching from practice.
mp_drop_knife_enable 0
mp_autoteambalance 0
mp_limitteams 0
mp_friendlyfire 1
mp_round_restart_delay 7
mp_team_intro_time 6.5
mp_team_timeout_max 3
mp_team_timeout_time 30
mp_technical_timeout_per_team 1
mp_backup_round_auto 1
mp_backup_round_file "fraglab_backup"
mp_match_end_restart 0
mp_match_end_changelevel 0
sv_deadtalk 1
sv_talk_enemy_dead 0
// Cash rewards (retake mode turns these off)
mp_playercashawards 1
mp_teamcashawards 1
mp_afterroundmoney 0
// A coach counts as a team member, which would give the other team the short-handed bonus
cash_team_bonus_shorthanded 0
// Undo practice mode settings
sv_showimpacts 0
sv_grenade_trajectory_prac_pipreview 0
sv_grenade_trajectory_prac_trailtime 0
bot_stop 0
sv_cheats 0
sv_infinite_ammo 0
mp_ignore_round_win_conditions 0
mp_respawn_on_death_ct 0
mp_respawn_on_death_t 0
// Grenade limits: 2 flashes, 4 grenades in total, 1 of every other type
ammo_grenade_limit_flashbang 2
ammo_grenade_limit_total 4
ammo_grenade_limit_default 1

// Retake and deathmatch change these; the scrim sets them too so nothing leaks into a match.
mp_ct_default_primary ""
mp_randomspawn 0
mp_respawnwavetime_ct 0
mp_respawnwavetime_t 0
mp_solid_teammates 1
mp_t_default_primary ""
mp_teammates_are_enemies 0
mp_timelimit 0
sv_grenade_trajectory_time_spectator 0
